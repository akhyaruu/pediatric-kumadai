# conda env create -f environment_win.yml
# conda activate pediatric-kumadai

name: pediatric-kumadai
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torchvision==0.18.1
      - numpy==1.26.4
      - pandas==2.2.2
      - scikit-learn==1.4.2
      - scipy==1.13.1
      - opencv-python==4.10.0.84
      - matplotlib==3.8.4
      - pillow
      - progressbar2==4.4.2
      - tqdm
      - pyyaml
      - openpyxl
